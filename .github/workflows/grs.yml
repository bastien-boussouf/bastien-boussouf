name: Update README cards

on:
  schedule:
    - cron: "0 3 * * SAT"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=darcula&hide_border=true&count_private=true&rank_icon=github
          path: profile/grs.svg
          token: ${{ secrets.PAT }}

      - name: Commit card
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/grs.svg
          git commit -m "ci: Update README cards" || exit 0
          git push